# /etc/nginx/sites-available/knoxis  (setup_vm.sh installs and enables it)
# HTTP only: `certbot --nginx -d knoxis.in -d www.knoxis.in` adds the TLS server block and the redirect.

limit_req_zone  $binary_remote_addr zone=knoxis_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=knoxis_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name knoxis.in www.knoxis.in;

    # The API is read-only
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    client_max_body_size 1k;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Optional Content-Security-Policy. The page uses inline script/style and loads uPlot from jsDelivr and a font
    # from Google Fonts, so those are allowed. Enable it, then check the browser console for blocked resources.
    #add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req  zone=knoxis_req burst=40 nodelay;
        limit_conn knoxis_conn 20;

        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For would otherwise let anyone dodge the per-IP limit.
        # If you later put another proxy or CDN in front of nginx, revisit this line.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;     # a first open of a day can take several seconds
    }
}
